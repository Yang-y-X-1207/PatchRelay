server:
  host: 127.0.0.1
  port: 8787
  token: change-me

repo:
  path: .
  base_branch: main
  state_dir: .patchrelay

worker:
  default: claude
  codex_command: codex
  claude_command: claude
  # Prepend a short handoff protocol to each real worker's instruction so a
  # headless claude/codex knows it may delegate the next step to another agent
  # by writing .patchrelay/handoff.json. Set false to disable multi-agent relay.
  enable_handoff: true

tests:
  default:
    command: ["python", "-m", "pytest"]

limits:
  max_log_bytes: 1048576
  max_diff_bytes: 5242880
  task_timeout_seconds: 3600
  # Per-worker wall-clock ceiling, normally shorter than task_timeout_seconds. A
  # single worker invocation that stalls (e.g. an occasional provider hang under
  # high reasoning effort) is killed after this instead of burning the whole task
  # budget. If the worker already left changes, the diff is preserved and the task
  # lands in the soft "timed_out" state rather than "failed".
  worker_timeout_seconds: 1800
  # Maximum number of handoff hops in a ping-pong chain (A->B->A...). Each child
  # task is one hop deeper than its parent; a handoff that would exceed this is
  # refused and the task completes normally, so a relay chain cannot loop forever.
  max_handoff_depth: 4
