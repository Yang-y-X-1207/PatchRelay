[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchrelay"
version = "0.1.0"
description = "Local A2A-compatible coding execution relay."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
patchrelay = "patchrelay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchrelay"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
